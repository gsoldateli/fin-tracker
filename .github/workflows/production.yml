name: Production Deploy

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow deploys from release branch
        run: |
          if [ "${{ github.ref_name }}" != "release" ]; then
            echo "Production deploy is only allowed from 'release' branch."
            echo "Selected branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ 'release' branch confirmed."

  gates:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy-production:
    needs: gates
    runs-on: ubuntu-latest
    environment: production  # enable environment secrets + protections
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci

      - name: Run migrations on production DB
        env:
          TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx drizzle-kit migrate

      - name: Deploy production to Vercel
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production
          vercel build --prod
          url=$(vercel deploy --prebuilt --prod)
          echo "🚀 Production: $url" >> "$GITHUB_STEP_SUMMARY"